<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>40個單字超大碗公挑戰！｜W4 單字闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Huninn&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e3; --bg2:#ffe7ae; --ink:#1d1a22; --ink-soft:#4f4757;
  --card:#ffffff; --line:#1d1a22;
  --red:#e3262c; --red-deep:#9e1217; --red-soft:#ffe4e1;
  --yellow:#ffd21f; --yellow-deep:#b98a00; --yellow-soft:#fff3bf;
  --blue:#1d63d6; --blue-deep:#0f3f95; --blue-soft:#e3eeff;
  --orange:#ff8a1f; --rays:rgba(255,160,30,.12);
  --f:'Baloo 2','Huninn','PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --ft:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#191522; --bg2:#2a1f33; --ink:#fbf3e4; --ink-soft:#d4cbdc;
  --card:#26202f; --line:#000000;
  --red:#ff4d52; --red-deep:#8e0f14; --red-soft:#4a1d24;
  --yellow:#ffd21f; --yellow-deep:#b98a00; --yellow-soft:#3d3416;
  --blue:#5e9bff; --blue-deep:#1d4fa8; --blue-soft:#1d2b4b;
  --orange:#ff9a3d; --rays:rgba(255,160,30,.05); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f);font-size:19px;line-height:1.55;color:var(--ink);background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 35%,var(--rays) 0deg 3deg,transparent 3deg 9deg),
             radial-gradient(circle at 50% 35%,var(--bg) 0 20%,var(--bg2) 85%)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 60px}

/* ---------- テロップ (telop) ---------- */
.tl{font-family:var(--ft);font-weight:900;line-height:1.2;letter-spacing:.02em;
  text-shadow:-2px -2px 0 var(--s),0 -2.5px 0 var(--s),2px -2px 0 var(--s),2.5px 0 0 var(--s),2px 2px 0 var(--s),0 2.5px 0 var(--s),-2px 2px 0 var(--s),-2.5px 0 0 var(--s),4px 4px 0 var(--d)}
.tl-red{--s:#c4161c;--d:#1d1a22;color:#fff}
.tl-yel{--s:#1d1a22;--d:#c4161c;color:#ffe14d}
.tl-blue{--s:#0f3f95;--d:#1d1a22;color:#fff}
.tl-sm{text-shadow:-1.5px -1.5px 0 var(--s),1.5px -1.5px 0 var(--s),1.5px 1.5px 0 var(--s),-1.5px 1.5px 0 var(--s),0 2px 0 var(--s),2px 0 0 var(--s),-2px 0 0 var(--s),0 -2px 0 var(--s),3px 3px 0 var(--d)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:8px 12px;
  background:linear-gradient(90deg,var(--red),var(--orange));border-bottom:4px solid var(--line)}
.topbar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:7px}
.brand{border:none;background:none;cursor:pointer;padding:2px;margin-right:auto;white-space:nowrap;font-size:19px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;background:#fff;color:#1d1a22;border:3px solid var(--line);font-weight:800;font-size:16px;white-space:nowrap}
.pill.bump{animation:bump .45s}
.plab{font-family:var(--ft);font-weight:900;font-size:12px;color:#fff;background:var(--red);border-radius:5px;padding:0 4px;line-height:1.5}
.cell{display:inline-block;min-width:.72em;text-align:center;background:#fff;border:1.5px solid #cfc6b6;border-radius:4px;margin:0 1px;padding:0 2px;font-weight:800;line-height:1.35}
.iconbtn{width:38px;height:38px;flex:none;border-radius:10px;border:3px solid var(--line);background:#fff;font-size:16px;cursor:pointer;color:#1d1a22}

/* ---------- generic ---------- */
.card{position:relative;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:20px;box-shadow:6px 6px 0 var(--line)}
.btn{font-weight:800;font-size:19px;padding:12px 20px;border-radius:14px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);cursor:pointer;color:#1d1a22;background:#fff;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--red);color:#fff}
.btn.gold{background:var(--yellow);color:#1d1a22}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.glow{animation:flash 1.1s steps(2,jump-none) infinite}
.crumbs{display:flex;align-items:center;gap:10px;margin:6px 0 14px;font-weight:800;color:var(--ink);font-size:17px}
.crumbs .btn{padding:5px 12px;font-size:16px;box-shadow:3px 3px 0 var(--line)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pop-in{animation:zoomIn .35s cubic-bezier(.3,1.5,.5,1)}

/* ---------- hero ---------- */
.hero{position:relative;margin:8px 0 18px;padding:18px 16px 20px;border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 75% 55%,#ffd21f 0deg 8deg,#ffb21f 8deg 16deg)}
.hero .badge-top{display:inline-block;font-size:14px;white-space:nowrap;background:var(--blue);border:2.5px solid var(--line);border-radius:8px;padding:1px 10px;margin-bottom:6px}
.hero h1{margin:4px 0 0;font-size:clamp(25px,6.8vw,40px);white-space:nowrap;transform:rotate(-2deg);transform-origin:left}
.hero .sub{display:inline-block;margin-top:10px;background:#fff;border:2.5px solid var(--line);border-radius:10px;padding:2px 12px;font-family:var(--ft);font-weight:900;color:var(--red);font-size:17px;transform:rotate(1deg)}
.hero .wipebox{position:absolute;right:10px;bottom:10px;width:82px;height:82px;border:3px solid var(--line);border-radius:12px;background:#fff6d6;display:grid;place-items:center;box-shadow:3px 3px 0 var(--line)}
.hero .wipebox .mascot{width:70px;height:70px;animation:bob 1.6s ease-in-out infinite}
.hero .txt{padding-right:0}
.hero .sub{max-width:calc(100% - 92px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px;text-align:center;box-shadow:4px 4px 0 var(--line)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:14px;color:var(--ink-soft);font-weight:700}
.enc{text-align:center;color:var(--ink);font-weight:700;margin:12px 0 18px;font-size:17px}

/* ---------- 30分 timer bar ---------- */
.timer{margin:6px 0 4px}
.timer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.timer-head .lbl{font-size:17px}
.timer-head .cnt{font-weight:800;font-size:16px;background:var(--card);border:2.5px solid var(--line);border-radius:8px;padding:0 8px}
.ticks{position:relative;height:24px;margin:0 14px}
.ticks i{position:absolute;bottom:0;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:15px}
.tbar{position:relative;height:20px;margin:0 14px;border-radius:999px;background:#fff;border:3px solid var(--line)}
.tfill{height:100%;border-radius:999px;background:linear-gradient(#74b0ff,var(--blue));transition:width .7s cubic-bezier(.3,1.4,.5,1)}
.tmid{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:3px solid var(--line)}
.ball{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#ff9a9a,var(--red) 60%);border:3px solid var(--line);transition:left .7s cubic-bezier(.3,1.4,.5,1)}

/* ---------- menu (levels) ---------- */
.levels{padding:4px 0}
.level{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px;width:93%;padding:14px;margin:0 0 18px;
  border-radius:16px;background:var(--card);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line)}
.levels .level:nth-child(even){margin-left:auto}
.lv-badge{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--yellow-soft);border:3px solid var(--line)}
.level.next{background:linear-gradient(var(--card),var(--card)) padding-box,repeating-linear-gradient(45deg,var(--red) 0 10px,var(--yellow) 10px 20px) border-box;border:4px solid transparent}
.level.next .lv-badge{animation:bob 1.2s ease-in-out infinite;background:var(--yellow)}
.lv-body{flex:1;min-width:150px}
.lv-title{font-weight:800;font-size:19px}
.lv-words{font-size:15px;color:var(--ink-soft);line-height:1.35}
.lv-tag{display:inline-block;font-family:var(--ft);font-weight:900;font-size:13px;color:#fff;background:var(--red);border-radius:6px;padding:0 6px;margin:2px 4px 2px 0}
.lv-tag.b{background:var(--blue)}
.lv-stamp{position:absolute;right:10px;top:-14px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;transform:rotate(14deg);
  border:3.5px double var(--red);background:var(--card);color:var(--red);font-family:var(--ft);font-weight:900;font-size:19px;animation:stampIn .4s cubic-bezier(.3,1.6,.5,1)}
.lv-btns{display:flex;gap:8px;width:100%}
.lv-btns button{flex:1;font-size:16px;font-weight:800;padding:8px;border-radius:12px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.lv-btns button.q{background:var(--red);color:#fff}
.lv-btns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.homebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.legend{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:14px}

/* ---------- learn ---------- */
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);transition:all .3s}
.dot.done{background:var(--yellow)}
.dot.now{background:var(--red);width:36px;border-radius:8px}
.wordrow{display:flex;align-items:center;gap:16px}
.word{font-size:clamp(32px,9vw,48px);font-weight:800;line-height:1.05;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:16px}
.kk{color:var(--ink-soft);font-family:'Lucida Sans Unicode','Arial Unicode MS','Segoe UI',sans-serif}
.pos{padding:0 9px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;border:2px solid var(--line)}
.lm{font-size:14px;color:var(--blue);font-weight:800;text-decoration:none;border-bottom:2px solid var(--blue)}
.speak{flex:none;cursor:pointer;border-radius:50%;color:#fff;background:var(--red);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);position:relative}
.speak.big{width:72px;height:72px;font-size:30px}
.speak.huge{width:116px;height:116px;font-size:48px;display:block;margin:12px auto}
.speak:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.talking::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--yellow);animation:ring .8s ease-out infinite}
.reveal{display:block;width:100%;margin-top:18px;padding:16px;border:3px dashed var(--line);background:var(--yellow-soft);color:var(--ink);border-radius:16px;font-size:20px;font-weight:800;cursor:pointer;animation:wiggle 2.2s ease-in-out infinite}
.zh{margin-top:16px;font-size:32px}
.sec{margin-top:18px;padding-top:14px;border-top:3px dotted var(--line)}
.sec-t{display:inline-block;font-size:15px;font-weight:800;margin-bottom:10px;padding:1px 10px;border-radius:8px;background:var(--ink);color:var(--card)}
.col{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:10px 14px;margin-bottom:8px;border-radius:12px;border:2.5px solid var(--line);background:var(--blue-soft);color:var(--ink);cursor:pointer}
.col:active{transform:translate(2px,2px)}
.col-txt{flex:1;display:flex;flex-direction:column}
.col-en{font-weight:700;font-size:20px;line-height:1.3}
.col-zh{font-size:16px;color:var(--ink-soft)}
.mini{font-size:18px}
mark{background:linear-gradient(transparent 50%,color-mix(in srgb,var(--yellow) 75%,transparent) 50%);color:inherit;padding:0 2px;font-weight:800}
.ex{font-size:21px;line-height:1.75;margin:0}
.blank{display:inline-block;min-width:116px;padding:0 14px;border-radius:10px;border:3px dashed var(--red);background:var(--red-soft);color:var(--red);font-size:19px;font-weight:800;cursor:pointer;animation:wiggle 2.4s ease-in-out infinite;line-height:1.6}
.ans{display:inline-block;padding:0 10px;border-radius:10px;background:var(--yellow);color:#1d1a22;font-weight:800;border:2.5px solid var(--line)}
.tw{text-decoration:underline wavy var(--orange);text-decoration-thickness:2.5px;text-underline-offset:6px;font-weight:700}
.exzh{margin-top:8px;color:var(--ink-soft);font-size:17px}
.chip{margin-top:10px;font-size:16px;font-weight:800;padding:6px 14px;border-radius:999px;border:2.5px solid var(--line);background:var(--yellow);color:#1d1a22;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.hint{color:var(--ink-soft);font-size:16px;text-align:right;font-weight:700}

/* ---------- quiz ---------- */
.gems{display:flex;justify-content:center;gap:12px;margin:14px 0 4px}
.gem{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px;transition:all .3s}
.gem.g1{background:var(--yellow)}
.gem.g2{background:var(--red);color:#fff}
.gem.g2::after{content:"✓";font-weight:900}
.gem-note{text-align:center;font-size:14px;color:var(--ink-soft);margin-bottom:12px;font-weight:700}
.qtype{display:inline-block;font-family:var(--ft);font-weight:900;font-size:16px;padding:2px 12px;border-radius:8px;background:var(--blue);color:#fff;border:2.5px solid var(--line);transform:rotate(-2deg)}
.qhint{text-align:center;color:var(--ink-soft);margin:4px 0 0;font-weight:700}
.qword{text-align:center;font-size:36px;font-weight:800;margin-top:8px}
.qword small{display:block;font-size:16px;color:var(--ink-soft);font-weight:500}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;min-height:66px;padding:12px 24px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:21px;font-weight:700;box-shadow:4px 4px 0 var(--line);cursor:pointer;line-height:1.3;text-align:center}
.opt .k{position:absolute;top:4px;left:8px;font-size:13px;color:var(--ink-soft);font-weight:800}
.opt:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.opt.right{background:var(--yellow);color:#1d1a22;animation:popbig .5s cubic-bezier(.3,1.6,.5,1)}
.opt.right::after{content:"⭕";position:absolute;right:4px;top:-12px;font-size:26px}
.opt.miss{background:var(--blue-soft);animation:shake .4s}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:14px;border:3px solid var(--line)}
.fb.yay{background:var(--yellow-soft)}
.fb.hug{background:var(--blue-soft)}
.fb b{font-size:20px}
.fb .sub{font-size:17px;color:var(--ink-soft)}
.fb .btn{margin-top:8px;padding:9px 18px;font-size:17px}

/* ---------- clear ---------- */
.clear-box{text-align:center;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 50% 30%,var(--yellow-soft) 0deg 8deg,var(--card) 8deg 16deg)}
.clear-box .mascot{width:140px;height:140px;animation:jump .9s ease-in-out infinite}
.kanshoku{font-size:clamp(56px,17vw,92px);margin:0;transform:rotate(-4deg);animation:slam .6s cubic-bezier(.3,1.6,.5,1)}
.clear-box h2{font-size:24px;margin:6px 0}
.recap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}
.recap button{font-size:17px;font-weight:800;padding:6px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.bonus{display:inline-flex;align-items:center;gap:6px;margin:10px 0;padding:6px 14px;border-radius:12px;background:#fff;border:3px solid var(--line);color:#1d1a22;font-weight:800;font-size:20px;box-shadow:4px 4px 0 var(--red)}

/* ---------- trophies ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{text-align:center;padding:14px 10px;border-radius:16px;background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line)}
.bdg .ic{font-size:44px;line-height:1.2}
.bdg b{display:block;font-size:18px}
.bdg span{font-size:14px;color:var(--ink-soft)}
.bdg.off .ic{filter:grayscale(1);opacity:.35}
.bdg.on{background:var(--yellow-soft)}

/* ---------- fx ---------- */
.cf{position:fixed;width:11px;height:15px;border-radius:2px;border:1.5px solid #1d1a22;pointer-events:none;z-index:99;animation:cf 1.1s ease-out forwards}
.float{position:fixed;z-index:99;font-size:28px;pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:100;display:flex;align-items:center;gap:10px;color:#1d1a22;
  padding:8px 16px;border-radius:14px;background:var(--yellow);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);font-weight:800;animation:toastIn 3s ease forwards;white-space:nowrap}
.toast .ic{font-size:34px}
.toast small{display:block;font-weight:600;font-size:14px}
.stampfx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:97}
.stampfx span{font-size:clamp(54px,16vw,96px);animation:slamOut 1s ease forwards;transform:rotate(-6deg)}
.wipe{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:96;width:116px;border:3px solid var(--line);border-radius:12px;
  background:#fff6d6;box-shadow:4px 4px 0 var(--line);text-align:center;padding:4px 4px 6px;pointer-events:none;animation:wipeIn 1.9s ease forwards}
.wipe.blue{background:#e3eeff}
.wipe .mascot{width:76px;height:76px}
.wipe span{display:block;font-size:15px;line-height:1.2}
.wipe .wtag{position:absolute;top:-12px;left:6px;font-family:var(--ft);font-weight:900;font-size:11px;color:#fff;background:var(--red);border:2px solid var(--line);border-radius:5px;padding:0 4px}
.combo{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:98}
.combo::before{content:"";position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,210,31,.35) 0deg 6deg,transparent 6deg 14deg);animation:spinFade 1.3s ease forwards}
.combo span{position:relative;font-size:clamp(46px,13vw,72px);animation:comboPop 1.3s ease forwards}

@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes zoomIn{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
@keyframes popbig{0%{transform:scale(.9)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.25) rotate(-3deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes wiggle{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-3deg)}92%{transform:rotate(3deg)}96%{transform:rotate(-2deg)}}
@keyframes flash{0%{box-shadow:4px 4px 0 var(--line)}50%{box-shadow:4px 4px 0 var(--line),0 0 0 6px var(--yellow)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes stampIn{0%{transform:scale(2.4) rotate(30deg);opacity:0}100%{transform:scale(1) rotate(14deg);opacity:1}}
@keyframes slam{0%{transform:scale(3) rotate(-4deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}

/* ===================== 語音 ===================== */
let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))
     ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let unlocked=false;
document.addEventListener("pointerdown",()=>{
  if(unlocked||!("speechSynthesis" in window))return;unlocked=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}
},{once:false});
function speak(t,rate=.85,btn){
  if(!("speechSynthesis" in window)){toast("🙏","這個瀏覽器不支援朗讀","換 Chrome 或 Safari 試試");return;}
  const go=()=>{
    const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.pitch=1.05;
    if(btn){btn.classList.add("talking");u.onend=u.onerror=()=>btn.classList.remove("talking");}
    speechSynthesis.speak(u);
  };
  try{ if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80);} else go(); }catch(e){}
}

let AC=null,OUT=null,NB=null;
function ac(){
  if(!AC){try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=6;
    OUT=AC.createGain();OUT.gain.value=.9;OUT.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}}
  if(AC&&AC.state==="suspended")AC.resume();return AC;
}
const ok_=()=>S.sound&&ac();
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(f,t0,d,type="triangle",vol=.14){
  if(!ok_())return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;env(g,t,.012,vol,d);o.connect(g);g.connect(OUT);o.start(t);o.stop(t+d+.1);
}
function glide(f1,f2,t0,d,vol=.12,type="sine"){
  if(!ok_())return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.01,vol,d);
  o.connect(g);g.connect(OUT);o.start(t);o.stop(t+d+.1);
}
function nz(t0,d,{f=1000,q=1,type="bandpass",vol=.2,a=.004}={}){
  if(!ok_())return;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+t0;
  s.buffer=NB;fl.type=type;fl.frequency.value=f;fl.Q.value=q;env(g,t,a,vol,d);
  s.connect(fl);fl.connect(g);g.connect(OUT);s.start(t,Math.random()*1.5);s.stop(t+a+d+.05);
}
/* 拍手 */
function applause(t0,dur,vol=.16){
  if(!ok_())return;const n=Math.floor(dur*75);
  for(let i=0;i<n;i++){const tt=t0+Math.random()*dur,r=(tt-t0)/dur;
    const amp=vol*Math.min(1,r/.12)*Math.min(1,(1-r)/.45)*(.5+Math.random()*.5);
    nz(tt,.025+Math.random()*.03,{f:900+Math.random()*2000,q:1.3,vol:Math.max(amp,.003),a:.002});}
}
/* 觀眾人聲：へぇ～／おお～／わぁ～／あ～／笑聲 */
const CROWD={
  hee:{f1:430,f2:1900,p:[.9,1.3,1.05]},
  oh:{f1:520,f2:880,p:[.85,1.3,1.2]},
  wa:{f1:820,f2:1300,p:[1.05,1.3,1.1]},
  aw:{f1:700,f2:1150,p:[1.2,.95,.8]},
  ha:{f1:760,f2:1250,p:[1.1,1.15,1],laugh:true}
};
function crowd(kind,t0,d,vol=.12,n=11){
  if(!ok_())return;const C=CROWD[kind];
  for(let v=0;v<n;v++){
    const base=Math.random()<.5?110+Math.random()*60:200+Math.random()*110;
    const st=AC.currentTime+t0+Math.random()*.12,o=AC.createOscillator(),g=AC.createGain(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),mix=AC.createGain();
    o.type="sawtooth";o.detune.value=Math.random()*40-20;
    o.frequency.setValueAtTime(base*C.p[0],st);o.frequency.linearRampToValueAtTime(base*C.p[1],st+d*.5);o.frequency.linearRampToValueAtTime(base*C.p[2],st+d);
    b1.type=b2.type="bandpass";b1.frequency.value=C.f1*(.92+Math.random()*.16);b2.frequency.value=C.f2*(.92+Math.random()*.16);b1.Q.value=5;b2.Q.value=7;
    mix.gain.value=1;o.connect(b1);o.connect(b2);b1.connect(g);b2.connect(g);g.connect(OUT);
    const pv=vol/n*3.2;
    if(C.laugh){
      g.gain.setValueAtTime(0,st);const rate=.15+Math.random()*.05;
      for(let k=0;k*rate<d;k++){const tk=st+k*rate,decay=1-k*rate/d;g.gain.setValueAtTime(0,tk);g.gain.linearRampToValueAtTime(pv*decay,tk+.025);g.gain.linearRampToValueAtTime(0,tk+rate*.7);}
    }else{
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(pv,st+.14);g.gain.setValueAtTime(pv,st+d*.55);g.gain.linearRampToValueAtTime(0,st+d);
    }
    o.start(st);o.stop(st+d+.1);
  }
  nz(t0,d*.9,{f:CROWD[kind].f2,q:1.5,vol:vol*.18,a:.12});
}
/* 太鼓、鼓聲、喇叭、鈴 */
function taiko(t0,vol=.5){glide(150,52,t0,.38,vol);nz(t0,.07,{f:250,q:.8,type:"lowpass",vol:vol*.5});}
function crash(t0,d=.9,vol=.12){nz(t0,d,{f:6000,q:.4,type:"highpass",vol,a:.003});}
function drumroll(t0,d){
  for(let t=0;t<d;t+=.034)nz(t0+t,.045,{f:2600,q:.8,vol:.04+.16*(t/d),a:.002});
  taiko(t0+d,.6);crash(t0+d,1.2,.14);
}
function horn(t0){ // パフ
  if(!ok_())return;const t=AC.currentTime+t0,fl=AC.createBiquadFilter(),g=AC.createGain();fl.type="bandpass";fl.frequency.value=1100;fl.Q.value=2.5;
  [330,415].forEach(f=>{const o=AC.createOscillator();o.type="square";o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.93,t+.18);o.connect(fl);o.start(t);o.stop(t+.22);});
  env(g,t,.01,.22,.18);fl.connect(g);g.connect(OUT);
}
function boing(t0){ // ビヨ～ン
  if(!ok_())return;const t=AC.currentTime+t0,o=AC.createOscillator(),lfo=AC.createOscillator(),dep=AC.createGain(),g=AC.createGain();
  o.type="triangle";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(340,t+.75);
  lfo.frequency.value=15;dep.gain.setValueAtTime(90,t);dep.gain.exponentialRampToValueAtTime(1,t+.75);
  lfo.connect(dep);dep.connect(o.frequency);env(g,t,.01,.2,.75);o.connect(g);g.connect(OUT);o.start(t);lfo.start(t);o.stop(t+.85);lfo.stop(t+.85);
}
function bell(t0){tone(2093,t0,1.6,"sine",.13);tone(3140,t0,1,"sine",.05);tone(5280,t0,.6,"sine",.03);} // チーン
function brass(fs,t0,d,vol=.07){
  if(!ok_())return;const t=AC.currentTime+t0;
  fs.forEach(f=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=f;
    fl.type="lowpass";fl.frequency.setValueAtTime(500,t);fl.frequency.linearRampToValueAtTime(2600,t+.06);fl.frequency.linearRampToValueAtTime(1400,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(fl);fl.connect(g);g.connect(OUT);o.start(t);o.stop(t+d+.05);});
}

/* ---------- iPhone / 平板解鎖音效（靜音鍵、自動播放限制） ---------- */
let silentEl=null;
function silentWavURL(){const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));}
function unlockAudio(){
  try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback";}catch(e){}
  const c=ac();if(!c)return;
  if(c.state!=="running")c.resume();
  try{const b=c.createBufferSource();b.buffer=c.createBuffer(1,1,22050);b.connect(c.destination);b.start(0);}catch(e){}
  if(!silentEl&&/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)&&"ontouchend" in document){
    try{silentEl=new Audio(silentWavURL());silentEl.loop=true;silentEl.setAttribute("playsinline","");silentEl.play().catch(()=>{});}catch(e){}
  }
}
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(silentEl)silentEl.pause();}else{if(silentEl)silentEl.play().catch(()=>{});if(AC&&AC.state!=="running")AC.resume();}});

      ${w.cols.map(c=>`<button class="col" data-act="say" data-t="${attr(plain(c[0]))}"><span class="col-txt"><span class="col-en">${fmtCol(c[0])}</span><span class="col-zh">${c[1]}</span></span><span class="mini">🔊</span></button>`).join("")}
    </div>
    <div class="sec pop-in"><div class="sec-t">📖 例句挖空：猜猜看，再點空格</div>
      <p class="ex">${exBlank(w,st>=2)}</p>
      ${st>=2?`<div class="exzh pop">${w.exzh}</div><button class="chip" data-act="say-ex">🔊 再聽一次整句</button>`:""}
    </div>`;
  }
  const last=L.i===G.words.length-1;
  const nextBtn=st<1?`<span class="hint">先聞香（聽發音），再翻開中文 🎧</span>`
    :last?`<button class="btn primary ${st>=2?"glow":""}" data-act="to-quiz">開吃！小測驗 🥢</button>`
         :`<button class="btn primary ${st>=2?"glow":""}" data-act="next">下一個 👉</button>`;
  return `
  <div class="crumbs"><button class="btn ghost" data-act="home">🍱 菜單</button><span>${G.icon} 第 ${L.g+1} 碗・看卡片</span></div>
  <div class="dots">${G.words.map((_,k)=>`<span class="dot ${k<L.i?"done":k===L.i?"now":""}"></span>`).join("")}</div>
  <article class="card ${L.fresh?"pop-in":""}">
    <div class="wordrow">
      <button class="speak big" data-act="say-word" aria-label="播放單字發音">🔊</button>
      <div><div class="word">${w.w}</div>
        <div class="meta"><span class="kk">${w.kk}</span><span class="pos">${w.pos}</span><a class="lm" href="${lm}" target="_blank" rel="noopener">Longman 發音</a></div></div>
    </div>
    ${body}
  </article>
  <div class="navrow"><button class="btn ghost" data-act="prev" ${L.i===0?"disabled":""}>👈 上一個</button>${nextBtn}</div>`;
}
function afterLearnRender(){
  L.fresh=false;
  if(L.steps[L.i]===0&&!L.auto[L.i]){
    L.auto[L.i]=true;const w=wL();
    setTimeout(()=>{if(V==="learn")speak(w.say||w.w,.8,document.querySelector('[data-act="say-word"]'));},380);
  }
}

/* ===================== 畫面：小測驗 ===================== */
function startQuiz(g){
  const n=GROUPS[g].words.length;
  Q={g,queue:shuffle([...Array(n).keys()]),consec:Array(n).fill(0),missed:new Set(),mistakes:0,cur:null,answered:false,last:-1,timer:null,res:null};
  V="quiz";window.scrollTo(0,0);nextQ();
}
const wQ=()=>GROUPS[Q.g].words[Q.cur.wi];
function nextQ(){
  clearTimeout(Q.timer);
  if(Q.consec.every(c=>c>=2))return finishGroup();
  let wi=Q.queue.shift();
  if(wi===Q.last&&Q.queue.length){Q.queue.push(wi);wi=Q.queue.shift();}
  const words=GROUPS[Q.g].words,type=Q.consec[wi]===0?"listen":"fill";
  const others=shuffle([...Array(words.length).keys()].filter(k=>k!==wi)).slice(0,3);
  const ids=shuffle([wi,...others]);
  Q.cur={wi,type,ids,correct:ids.indexOf(wi)};Q.answered=false;Q.res=null;Q.last=wi;Q.fresh=true;
  render();
  if(type==="listen"){const w=words[wi];setTimeout(()=>{if(V==="quiz"&&!Q.answered)speak(w.say||w.w,.8,document.querySelector('[data-act="say-q"]'));},400);}
}
function answer(k,btn){
  if(!Q||Q.answered)return;Q.answered=true;
  const ok=k===Q.cur.correct,wi=Q.cur.wi,w=wQ();
  const[x,y]=centerOf(btn);
  if(ok){
    Q.consec[wi]++;S.streak++;S.best=Math.max(S.best,S.streak);
    let pts=10;if(S.streak>=3)pts+=5;
    if(Q.cur.type==="listen")S.listenOK++;
    award("first");if(Q.missed.has(wi)&&Q.consec[wi]>=2)award("comeback");
    if(Q.consec[wi]<2)Q.queue.push(wi);
    Q.res={ok,k,pts,msg:rnd(YAY)};
    SFX.ok();burst(x,y,20);stampFx("正解！","tl-red");wipe("cheer",rnd(OKCAP));
    render();addScore(pts,document.querySelector(".opt.right"));bump("pStreak");
    if(S.streak===5||S.streak===10||S.streak===15||S.streak===20||(S.streak>20&&S.streak%10===0))setTimeout(()=>combo(S.streak+"連對！！"),350);
    if(Q.cur.type==="fill")setTimeout(()=>speak(full(w),.9),1200);
    Q.timer=setTimeout(()=>{if(V==="quiz"&&Q.answered)nextQ();},Q.cur.type==="fill"?3600:1700);
  }else{
    Q.consec[wi]=0;Q.missed.add(wi);Q.mistakes++;S.streak=0;
    Q.queue.splice(Math.min(2,Q.queue.length),0,wi);
    Q.res={ok,k,msg:rnd(HUG)};
    SFX.soft();stampFx("可惜～！","tl-blue");wipe("think",rnd(MISSCAP),true);render();updateTop();save();
    setTimeout(()=>speak(w.say||w.w,.8),1100);
  }
}
function quizHTML(){
  const G=GROUPS[Q.g],w=wQ(),words=G.words,c=Q.cur,done=Q.consec.reduce((a,b)=>a+Math.min(b,2),0),total=words.length*2;
  const optText=i=>c.type==="listen"?words[i].zh:words[i].ans;
  const opts=c.ids.map((id,k)=>{
    let cls="opt";
    if(Q.answered){ if(k===c.correct)cls+=" right"; else if(k===Q.res.k)cls+=" miss"; else cls+=" dim"; }
    return `<button class="${cls}" data-act="opt" data-k="${k}" ${Q.answered?"disabled":""}><span class="k">${k+1}</span>${optText(id)}</button>`;
  }).join("");
  let top;
  if(c.type==="listen"){
    top=`<span class="qtype">🎧 聽音選意</span>
      <button class="speak huge" data-act="say-q" aria-label="再聽一次">🔊</button>
      ${Q.answered?`<div class="qword pop">${w.w}<small>${w.kk}</small></div>`:`<p class="qhint">聽聽看，它是什麼意思？（可以一直按喇叭）</p>`}`;
  }else{
    top=`<span class="qtype">✏️ 例句填空</span>
      <p class="ex" style="margin-top:14px">${Q.answered?fmtTw(w.ex).replace("{}",`<span class="ans pop">${w.ans}</span>`):fmtTw(w.ex).replace("{}",'<span class="blank" style="animation:none;cursor:default">？</span>')}</p>
      ${Q.answered?`<div class="exzh pop">${w.exzh}</div><button class="chip" data-act="say-qex">🔊 聽整句</button>`:""}`;
  }
  let fb="";
  if(Q.answered){
    fb=Q.res.ok
     ?`<div class="fb yay pop"><div><b>${Q.res.msg}</b><div class="sub">賞金 +${Q.res.pts}${S.streak>=3?"（連對加碼 🔥）":""}</div><button class="btn primary" data-act="nextq">下一題 👉</button></div></div>`
     :`<div class="fb hug pop"><div><b>${Q.res.msg}</b><div class="sub">記住它：<b>${w.w}</b> ＝ ${w.zh} <button class="chip" style="margin:0 0 0 4px;padding:2px 10px" data-act="say-q">🔊</button></div><button class="btn primary" data-act="nextq">好，繼續 💪</button></div></div>`;
  }
  return `
  <div class="crumbs"><button class="btn ghost" data-act="home">🍱 菜單</button><span>${G.icon} 第 ${Q.g+1} 碗・開吃中</span></div>
  ${ribbon(done/total*100,"🍚 完食進度",done+" / "+total+" 口")}
  <div class="gems">${words.map((_,i)=>`<span class="gem g${Math.min(Q.consec[i],2)}" title="${attr(words[i].w)}"></span>`).join("")}</div>
  <div class="gem-note">每個字「聽音 ＋ 填空」連續答對，就吃完一口 ✓</div>
  <article class="card ${Q.fresh?"pop-in":""}" style="text-align:${c.type==="listen"?"center":"left"}">
    ${top}
    <div class="opts ${c.type==="fill"?"one":""}">${opts}</div>
    ${fb}
  </article>`;
}
function finishGroup(){
  const g=Q.g;S.cleared[g]=true;
  if(Q.mistakes===0){S.perfect[g]=true;award("perfect");}
  award("clear1");if(clearedCount()>=4)award("half");if(clearedCount()===8)award("all");
  V="clear";window.scrollTo(0,0);render();
  addScore(50,document.querySelector(".bonus"));SFX.win();bigBurst();
}
function clearHTML(){
  const G=GROUPS[Q.g],nb=Q.g+1<GROUPS.length;
  const praise=Q.mistakes===0?"一口都沒掉，零失誤完食！💎":`連最難嚼的 ${Q.missed.size} 個字都吃下去了，超有毅力！💪`;
  return `<div class="card clear-box pop-in">
    ${mascot("cheer")}
    <h1 class="kanshoku tl tl-red">完食！！</h1>
    <h2>第 ${Q.g+1} 碗「${G.name}」挑戰成功</h2>
    <div class="bonus"><span class="plab">完食獎金</span> 💰 +50</div>
    <p style="font-weight:700">${praise}</p>
    <div class="sec-t">這一碗的 5 個字，點一下再聽一次</div>
    <div class="recap">${G.words.map(w=>`<button data-act="say" data-t="${attr(w.say||w.w)}">🔊 ${w.w}</button>`).join("")}</div>
    <div class="homebtns">
      ${nb?`<button class="btn primary glow" data-act="learn" data-g="${Q.g+1}">下一碗！第 ${Q.g+2} 碗 🍜</button>`:""}
      <button class="btn gold" data-act="home">🍱 回菜單</button>
      <button class="btn ghost" data-act="quiz" data-g="${Q.g}">再吃一次</button>
    </div></div>`;
}

/* ===================== 畫面：徽章 ===================== */
function badgesHTML(){
  return `<div class="crumbs"><button class="btn ghost" data-act="home">🍱 菜單</button><span>🏆 獎盃櫃</span></div>
  <div class="bgrid">${BADGES.map(b=>`<div class="bdg ${S.badges[b.id]?"on":"off"}"><div class="ic">${b.ic}</div><b>${b.name}</b><span>${S.badges[b.id]?b.d:"還沒拿到：<br>"+b.d}</span></div>`).join("")}</div>`;
}

/* ===================== 路由與事件 ===================== */
function render(){
  let h="";
  if(V==="home")h=homeHTML();else if(V==="learn")h=learnHTML();else if(V==="quiz")h=quizHTML();else if(V==="clear")h=clearHTML();else if(V==="badges")h=badgesHTML();
  app.innerHTML=h;updateTop();
  if(V==="learn")afterLearnRender();
  if(V==="quiz")Q.fresh=false;
}
function go(v){V=v;if(v==="learn")L.fresh=true;if(Q)clearTimeout(Q.timer);window.scrollTo(0,0);render();}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,g=+b.dataset.g;
  switch(a){
    case "home":if("speechSynthesis" in window)speechSynthesis.cancel();go("home");break;
    case "badges":go("badges");break;
    case "learn":startLearn(g);break;
    case "quiz":startQuiz(g);break;
    case "say":speak(b.dataset.t,.85,b);break;
    case "say-word":{const w=wL();speak(w.say||w.w,.8,b);break;}
    case "say-ex":speak(full(wL()),.9,b);break;
    case "rev-zh":{
      const w=wL();L.steps[L.i]=1;SFX.pop();
      const first=!S.seen[w.w+"#z"];S.seen[w.w+"#z"]=1;
      render();if(first)addScore(2,document.querySelector(".zh"));break;}
    case "rev-blank":{
      const w=wL(),[x,y]=centerOf(b);L.steps[L.i]=2;SFX.jan();burst(x,y,14);
      const first=!S.seen[w.w+"#b"];S.seen[w.w+"#b"]=1;
      render();if(first)addScore(2,document.querySelector(".ans"));
      setTimeout(()=>speak(full(w),.9),650);break;}
    case "next":if(L.i<4){L.i++;L.fresh=true;render();window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});}break;
    case "prev":if(L.i>0){L.i--;L.fresh=true;render();}break;
    case "to-quiz":startQuiz(L.g);break;
    case "opt":answer(+b.dataset.k,b);break;
    case "nextq":nextQ();break;
    case "say-q":{const w=wQ();speak(w.say||w.w,.8,b);break;}
    case "say-qex":speak(full(wQ()),.9,b);break;
    case "testsound":if(!S.sound){S.sound=true;save();updateTop();}unlockAudio();setTimeout(()=>SFX.ok(),60);toast("🔔","有聽到「ピンポーン」和拍手嗎？","沒有的話看看下面的小提示");break;
    case "sound":S.sound=!S.sound;save();updateTop();if(S.sound)SFX.ok();toast(S.sound?"🔔":"🔕",S.sound?"綜藝音效 ON":"綜藝音效 OFF",S.sound?"拍手、歡呼、ピンポーン都會出現":"單字發音照常播放");break;
    case "theme":{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t);}catch(err){}updateTop();break;}
    case "reset":if(confirm("要重新開始嗎？分數、過關紀錄和徽章都會清空喔。")){S=defState();save();go("home");}break;
  }
});
document.addEventListener("keydown",e=>{
  if(V!=="quiz"||!Q)return;
  if(!Q.answered&&/^[1-4]$/.test(e.key)){const k=+e.key-1;answer(k,document.querySelector(`.opt[data-k="${k}"]`));}
  else if(Q.answered&&(e.key==="Enter"||e.key===" ")){e.preventDefault();nextQ();}
});
render();
</script>
</body>
</html>
